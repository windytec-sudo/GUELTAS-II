<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Wind turbine / Wind energy icon inside safe zone -->
  <g transform="translate(106, 106)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wind path 1 -->
    <path d="M 50 150 A 30 30 0 0 1 200 150 A 25 25 0 0 1 250 130 A 25 25 0 0 1 250 80 A 25 25 0 0 0 200 100" />
    <!-- Wind path 2 -->
    <path d="M 20 200 A 30 30 0 0 1 220 200 A 20 20 0 0 1 260 185 A 20 20 0 0 1 260 145 A 20 20 0 0 0 220 160" />
    <!-- Wind path 3 -->
    <path d="M 60 250 A 30 30 0 0 1 180 250 A 15 15 0 0 1 210 238 A 15 15 0 0 1 210 210 A 15 15 0 0 0 180 220" />
    <!-- Tower base -->
    <path d="M 120 280 L 150 150 L 180 280" stroke="#38bdf8" stroke-width="16" />
    <circle cx="150" cy="150" r="14" fill="#38bdf8" />
  </g>
  <!-- Title / Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">WINDYTEC</text>
</svg>
